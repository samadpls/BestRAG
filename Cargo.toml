[package]
name = "bestrag"
version = "1.1.0"
edition = "2024"
description = "Hybrid retrieval over Postgres with pgvector or Qdrant: dense and BM25 search, fused and reranked."
license = "MIT"
repository = "https://github.com/samadpls/BestRAG"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "dep:pythonize"]

[dependencies]
anyhow = "1.0.105"
dirs = "7.0.0"
# rustls instead of native TLS keeps OpenSSL out of the Linux wheels.
fastembed = { version = "7.8.0", default-features = false, features = [
    "onnx",
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
    "fancy-regex",
] }
pdf-extract = "0.12.1"
pyo3 = { version = "0.30.1", features = ["abi3-py310"], optional = true }
pythonize = { version = "0.30.0", optional = true }
qdrant-client = { version = "1.20.0", default-features = false, features = ["serde"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
unicode-normalization = "0.1.26"
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }
