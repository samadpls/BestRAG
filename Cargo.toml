[package]
name = "bestrag"
version = "0.4.0"
edition = "2024"
description = "Hybrid retrieval over Qdrant: dense and sparse search, fused and reranked."
license = "MIT"
repository = "https://github.com/samadpls/BestRAG"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "dep:pythonize"]

[dependencies]
anyhow = "1.0.105"
dirs = "7.0.0"
# rustls instead of native TLS keeps OpenSSL out of the Linux wheels.
fastembed = { version = "7.8.0", default-features = false, features = [
    "onnx",
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
    "fancy-regex",
] }
pdf-extract = "0.12.1"
pyo3 = { version = "0.30.1", features = ["abi3-py310"], optional = true }
pythonize = { version = "0.30.0", optional = true }
qdrant-client = { version = "1.20.0", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
uuid = { version = "1.29.3", features = ["v4"] }
