[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bestrag"
description = "Hybrid search for RAG over Postgres with pgvector or Qdrant: dense and BM25 search, fused and reranked."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "samadpls", email = "abdulsamadsid1@gmail.com" }]
maintainers = [{ name = "samadpls", email = "abdulsamadsid1@gmail.com" }]
keywords = ["rag", "hybrid-search", "pgvector", "postgres", "qdrant", "retrieval", "embeddings"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://bestrag.samadpls.com"
Documentation = "https://bestrag.samadpls.com"
Repository = "https://github.com/samadpls/BestRAG"
Changelog = "https://bestrag.samadpls.com/changelog/"
Issues = "https://github.com/samadpls/BestRAG/issues"

[dependency-groups]
dev = ["pytest>=8"]
eval = ["pyarrow>=18"]

[tool.maturin]
features = ["python", "pyo3/extension-module"]
python-source = "python"
module-name = "bestrag._bestrag"

[tool.pytest.ini_options]
testpaths = ["tests"]
