name: Wheels

# Builds the wheels and the source distribution. Publishing to PyPI is a
# separate, manual step (see CONTRIBUTING.md). Pull requests build them too, so
# a change that breaks a platform shows up before a release.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    env:
      # The bundled ONNX Runtime needs macOS 13.4, but macOS wheel tags only carry
      # the major version, so a 13.x tag would also install on 13.0 to 13.3.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      # Importing loads the bundled ONNX Runtime, so a missing system library
      # (DirectML on Windows, for example) fails here instead of on a user's machine.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import the built wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist bestrag
          python -c "import bestrag; print(bestrag.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist
